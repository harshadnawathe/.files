# vim: ft=tmux
# Agent workflow. The workmux part is skipped entirely when workmux is not
# installed: no key table, and bin/agents.sh prints nothing in the status
# bar. The bell handling below is useful with or without agents.

# A bell from another window (an agent finishing or asking) flags its tab
# and shows a message. Jump to it with the default M-n / M-p.
set -g bell-action other
set-hook -g alert-bell 'display -d 3000 "bell: #{session_name}:#{window_index} #{window_name}"'

# prefix a, then one key. n and l repeat without the prefix, so a n n n
# cycles through the agents that want attention.
if -b 'command -v workmux' {
  # Agent glyphs come from status_icons in workmux/config.yaml.
  run -b '~/.config/tmux/bin/agent-icons'

  bind -N "Agent keys: d s n l r ?" a switch-client -T agent

  bind -T agent -N "Open the workmux dashboard" d \
    display-popup -E -w80% -h80% -d '#{pane_current_path}' -T '[ workmux ]' 'workmux dashboard'
  bind -T agent -N "Toggle the workmux sidebar" s run -b 'workmux sidebar'
  bind -T agent -r -N "Jump to the agent done or waiting; repeat to cycle" n run -b 'workmux last-done'
  bind -T agent -r -N "Toggle between the two most recent agents" l run -b 'workmux last-agent'
  bind -T agent -N "Restore worktree sessions after a crash" r run -b 'workmux resurrect'
  bind -T agent -N "List the agent keys" ? list-keys -N -T agent
}
