# open fish shell on start
set -g default-command "exec fish -i"

#### Options ####
# Use Ctrl-a as prefix
set -g prefix C-a

# Enable mouse
setw -g mouse on
# Vi key bindings in Copy mode
setw -g mode-keys vi
# Put status bar on top
set-option -g status-position top 
# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on
# Switch to any exising session when final window for current session is closed.
set-option -g detach-on-destroy off
set -g pane-border-lines double
# Show the active pane in the border colour *and* via the arrow indicator
set -g pane-border-indicators both
set -g status-left-length "100"
set -g status-right-length "100"

# Flag background activity in the window tab (styled in theme.conf).
# Without monitor-activity, window-status-activity-style never fires.
setw -g monitor-activity on
set -g visual-activity off

# Image rendering
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Enable undercurl
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
# Enable undercurl colors
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

set -g extended-keys on
set -as terminal-features ',xterm-ghostty:extkeys'

#### key-bindings ####

# Open new window with pane_current_path
unbind c
bind c new-window -c "#{pane_current_path}"

# pain-control rebinds `l` to select-pane -R, which eats tmux's default
# last-window. Restore it on an otherwise-unbound key.
bind -r BSpace last-window

# Lazy Git
bind G display-popup -d '#{pane_current_path}' -w80% -h80% -T '[ lazygit ]' -E lazygit

# Session management
# bind-key -n 'M-Space' run-shell '~/.config/tmux/ts.sh'
bind-key -n 'M-Space' "display-popup -E -w 70% -h 70% -d '#{pane_current_path}' -T '[ Sesh ]' tv sesh"
# cheat
bind i display-popup -T '[ cheat.sh ]' -w80% -h80% -E 'tmux new-session -A -s _cheat "tmux set status off; tv cheat.sh; tmux detach -s _cheat"'

# Workmux
bind W display-popup -d '#{pane_current_path}' -w80% -h80% -E 'workmux dashboard'

bind a run-shell 'workmux sidebar'

# Jump to the agent that most recently finished or is waiting; repeat to cycle
bind A run-shell 'workmux last-done'
# Toggle between the two most recent agents, like last-window
bind Tab run-shell 'workmux last-agent'
# Restore worktree sessions after a tmux or machine crash
bind M-r run-shell 'workmux resurrect'

# notes
bind N display-popup -T '[ notes ]' -w80% -h80% -E 'tmux attach _notes || tmux new-session -A -s _notes "tmux set status off; ~/bin/obsidian_notes; tmux detach -s _notes"'

# copy mode
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'C-v' send -X rectangle-toggle
bind-key -T copy-mode-vi Escape send -X cancel
# bind-key -T copy-mode-vi 'y' send -X copy-selection
# Applicable to macOS only
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

#### Status line ####
source ~/.config/tmux/theme.conf

#### Plugins ####

# plugins
source ~/.config/tmux/plugins.conf

# Plugin manager
# Need to clone the repo with following command
# git clone git@github.com:tmux-plugins/tpm.git ~/.config/tmux/plugins/tpm

set -g @plugin 'tmux-plugins/tpm'

# Initialize TMUX plugin manager (keep this line at the very bottom)
run '~/.config/tmux/plugins/tpm/tpm'
