# vim: ft=tmux
#
# Everything lives in conf.d/, loaded in name order. To switch a part off,
# rename it so it no longer ends in .conf.
#
#   10-options   server/session options that differ from tmux defaults
#   20-keys      core key bindings (tmux defaults are kept otherwise)
#   30-floating  floating panes
#   40-tools     popups, hidden sessions, fingers; each bound only if installed
#   50-agents    workmux agent keys and attention hooks
#   90-theme     colours, status bar, pane borders
#
# Bindings retired in the refactor are kept, not sourced, in
# bindings-archive.conf. Copy a line into conf.d/ to bring one back.

source-file -q ~/.config/tmux/conf.d/*.conf
