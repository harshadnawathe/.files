nerdfont: true
mode: session
agent: claude
panes: []
worktree_dir: "../{project}_worktrees/"
base_branch: auto
window_prefix: " {project}/"

# Keep workmux out of the tmux window format. Left on, it snapshots
# whatever window-status-format is global when it creates a window and
# pins that copy as a WINDOW-LOCAL option, which outranks `setw -g` -- so
# those windows keep rendering whatever theme was current at creation and
# never pick up later edits. theme.conf owns the format instead.
#
status_format: false

# Single source of the agent glyphs. workmux writes the icon into
# @workmux_pane_status; tmux (bin/agent-icons, run from 50-agents.conf)
# copies this block into @agent_icon_<status> for the status-right pill and
# the pane pill. Reload tmux (prefix R) after editing.
#
# stale is not a workmux icon -- it ignores the key. An agent is stale when
# its status has not changed for stale_after (default 1h); only
# `workmux status --json` reports it, so only the status-right pill uses it.
status_icons:
  working: "󰑮"
  waiting: "󰭹"
  done: "󰄬"
  stale: "󰅖"
