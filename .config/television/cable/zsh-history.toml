[metadata]
name = "zsh-history"
description = "A channel to select from your zsh history"
requirements = ["zsh"]

[source]
# $HISTFILE is deliberately not exported (see .config/zsh/.zshrc.d/00-history.zsh),
# so this reads the path directly. $XDG_STATE_HOME is exported from ~/.zshenv.
command = "sed '1!G;h;$!d' ${XDG_STATE_HOME:-${HOME}/.local/state}/zsh/history"
display = "{split:;:1..}"
output = "{split:;:1..}"
no_sort = true
frecency = false

[actions.execute]
description = "Execute the selected command"
command = "zsh -c '{split:;:1..}'"
mode = "execute"
