bind-key -T prefix M-u run-shell ~/.local/share/tmux/plugins/tpm/bindings/clean_plugins
bind-key -T prefix N display-popup -E -T "[ notes ]" -h "80%" -w "80%" "tmux attach _notes || tmux new-session -A -s _notes \"tmux set status off; ~/bin/obsidian_notes; tmux detach -s _notes\""
bind-key -T prefix R run-shell " \t\t\ttmux source-file ~/.config/tmux/tmux.conf > /dev/null; \t\t\ttmux display-message 'Sourced ~/.config/tmux/tmux.conf!'"
bind-key -T prefix S switch-client -l
bind-key -T prefix Space run-shell -b "/opt/homebrew/Cellar/tmux-fingers/2.7.1/bin/tmux-fingers start #{pane_id} >>~/.local/state/tmux-fingers/fingers.log 2>&1"
