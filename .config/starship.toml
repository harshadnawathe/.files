# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# Line 1 is context, line 2 is yours to type on.
#
# Line 1 is ordered by tense: left of $fill is state the next command runs
# in, outermost scope first; right of it is what the last command did, and
# is all conditional -- anything appearing there is an anomaly.
#
# A segment is monochrome: cap glyph and value share one hue, so the pair
# reads as one unit. Yellow left of $directory means "not your laptop".
# Neutrals rank within a segment: 7 secondary, 8 structure only (1.91:1
# here, too low to read).
#
# ANSI 0-15 only -- the Ghostty theme remaps these, so the prompt retints
# with it, as tmux/theme.conf does. Rules out gradients. No backgrounds:
# this draws into scrollback, where pill bodies would block the wallpaper.
#
# Glyphs match tmux where both surfaces name the same thing. Caps are never
# bold -- only a Regular Symbols Nerd Font is installed, so bold would be
# synthesised. Spacing groups instead: one space inside a segment, two
# between, trailing on the left and leading on the right so line 1 starts
# flush and ends at the edge.
#
# zsh/conf.d/transient-prompt.zsh collapses all of this on accept.

palette = 'ansi'

format = """
$hostname\
$container\
$kubernetes\
$aws\
$gcloud\
$azure\
$docker_context\
$directory\
$vcs\
$fill\
$jobs\
$status\
$cmd_duration\
$line_break\
$shell\
$shlvl\
$character
"""

# Top-level keys must stay above this header: TOML would bind them to it,
# and starship would silently fall back to its default prompt.
[palettes.ansi]
path  = '4'
vcs   = '5'
alert = '1'
warn  = '3'
ok    = '2'
muted = '8'
value = '15'
dim   = '7'

# A space, not a rule.
[fill]
symbol = ' '
style = 'fg:muted'

[hostname]
ssh_only = true
ssh_symbol = '󰒋 '
format = '[$ssh_symbol](fg:warn)[$hostname](fg:warn)  '

[container]
format = '[󰆧 ](fg:warn)[$name](fg:warn)  '

# Disabled by default upstream.
[kubernetes]
disabled = false
symbol = '󱃾 '
format = '[$symbol](fg:warn)[$context](fg:warn)[(:$namespace)](fg:dim)  '

[aws]
symbol = '󰅟 '
format = '[$symbol](fg:warn)[$profile](fg:warn)[(:$region)](fg:dim)  '

[gcloud]
symbol = '󰅟 '
format = '[$symbol](fg:warn)[$project](fg:warn)  '

[azure]
symbol = '󰅟 '
format = '[$symbol](fg:warn)[$subscription](fg:warn)  '

[docker_context]
only_with_files = true
symbol = '󰡨 '
format = '[$symbol](fg:warn)[$context](fg:warn)  '

# repo_root_format is ignored unless repo_root_style is also set.
# ( $path) is empty at the repo root, so the group and its separating space
# vanish there -- that is what makes "not at the root" visible.
[directory]
truncation_length = 0
truncation_symbol = '…/'
style = 'fg:path'
before_repo_root_style = 'fg:muted'
repo_root_style = 'bold fg:path'
read_only = ' 󰌾'
read_only_style = 'fg:alert'
format = '[󰉋 ](fg:path)[$path]($style)[$read_only]($read_only_style)  '
repo_root_format = '[󰉋 ](fg:path)[$before_root_path]($before_repo_root_style)[$repo_root]($repo_root_style)[($path)]($style)[$read_only]($read_only_style)  '

# $vcs expands to $git_branch$git_commit$git_state$git_metrics$git_status.
[git_branch]
format = '[󰘬 ](fg:vcs)[$branch](fg:vcs) '

[git_commit]
format = '[$hash$tag](fg:warn) '

[git_state]
format = '[$state( $progress_current/$progress_total)](bold fg:alert) '

# Counts, not flags. Symbols match tmux/git-status.sh; colours do not.
# Colour answers "how urgent", never "what kind" -- that is the glyph.
#
#   alert  cost grows while ignored  conflicted, diverged, $git_state
#   warn   lost if you walk away     untracked, behind, detached HEAD
#   ok     git is holding it         staged, modified, deleted, renamed,
#                                    typechanged, ahead
#   dim    parked on purpose         stashed
#
# alert is bold: red is this theme's dimmest hue (0.347 vs green's 0.525),
# so weight carries the rank that luminance cannot.
# behind fast-forwards and costs the same whenever; diverged compounds.
# Brackets are Monaspace's own angle brackets -- narrow, and clear of the
# renamed and ahead/behind symbols.
[git_status]
ignore_submodules = true
format = '([⟨ ](fg:muted)[$all_status$ahead_behind](fg:dim)[⟩](fg:muted))'
conflicted  = '[!$count](bold fg:alert) '
behind      = '[↓$count](fg:warn) '
diverged    = '[↕↑${ahead_count}↓${behind_count}](bold fg:alert) '
staged      = '[+$count](fg:ok) '
modified    = '[~$count](fg:ok) '
typechanged = '[±$count](fg:ok) '
deleted     = '[✘$count](fg:ok) '
renamed     = '[»$count](fg:ok) '
untracked   = '[?$count](fg:warn) '
stashed     = '[≡$count](fg:dim) '
ahead       = '[↑$count](fg:ok) '

[jobs]
symbol = '󰜎 '
symbol_threshold = 1
number_threshold = 1
format = ' [$symbol](fg:dim)[$number](fg:dim) '

# Disabled by default upstream. $status is the raw code -- the red character
# already says it failed. ${common_meaning}${signal_name}${maybe_int} would
# read 130 as INT instead.
[status]
disabled = false
pipestatus = true
pipestatus_separator = '[|](fg:muted)'
pipestatus_segment_format = '[$status](fg:dim)'
pipestatus_format = ' [󰅚 ](fg:alert)[$pipestatus](fg:dim)[ ⇒ ](fg:muted)[$status](fg:dim) '
format = ' [󰅚 ](fg:alert)[$status](fg:alert) '

[cmd_duration]
min_time = 3000
format = ' [ ](fg:warn)[$duration](fg:warn) '

# Silent in zsh.
[shell]
disabled = false
format = '[$indicator](fg:muted)'
fish_indicator = 'fish '
bash_indicator = 'bash '
zsh_indicator = ''
nu_indicator = 'nu '

[shlvl]
disabled = false
threshold = 2
format = '[↓$shlvl](fg:muted) '

[character]
success_symbol = '[❯](fg:ok)'
error_symbol = '[❯](fg:alert)'
vimcmd_symbol = '[❮](fg:ok)'
vimcmd_visual_symbol = '[❮](fg:warn)'
vimcmd_replace_symbol = '[❮](fg:alert)'
vimcmd_replace_one_symbol = '[❮](fg:alert)'
