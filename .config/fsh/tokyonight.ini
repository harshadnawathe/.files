; tokyonight-night for fast-syntax-highlighting.
; Palette: https://github.com/folke/tokyonight.nvim (extras/lua/tokyonight_night.lua)
; Applied by the atload in .zshrc whenever this file is newer than FSH's cache.

[base]
default          = none
unknown-token    = #f7768e,bold
commandseparator = #89ddff
redirection      = #89ddff
here-string-tri  = #e0af68
here-string-text = #9ece6a
here-string-var  = #7dcfff,bg:#292e42
exec-descriptor  = #e0af68,bold
comment          = #565f89
correct-subtle   = #7aa2f7
incorrect-subtle = #f7768e
subtle-separator = #89ddff
subtle-bg        = bg:#292e42
secondary        = free

[command-point]
reserved-word     = #bb9af7
subcommand        = #7dcfff
alias             = #7aa2f7
suffix-alias      = #7aa2f7
global-alias      = #ff9e64
builtin           = #2ac3de
function          = #7aa2f7
command           = #7aa2f7
precommand        = #bb9af7
hashed-command    = #7aa2f7
single-sq-bracket = #89ddff
double-sq-bracket = #89ddff
double-paren      = #89ddff

[paths]
path          = #c0caf5,underline
pathseparator =
path-to-dir   = #c0caf5,underline
globbing      = #ff9e64
globbing-ext  = #ff9e64,bold

[brackets]
paired-bracket  = bg:#3d59a1
bracket-level-1 = #7aa2f7
bracket-level-2 = #bb9af7
bracket-level-3 = #7dcfff

[arguments]
single-hyphen-option   = #e0af68
double-hyphen-option   = #e0af68
back-quoted-argument   = #bb9af7
single-quoted-argument = #9ece6a
double-quoted-argument = #9ece6a
dollar-quoted-argument = #9ece6a

[in-string]
; backslash in $'...'
back-dollar-quoted-argument           = #89ddff
; backslash or $... in "..."
back-or-dollar-double-quoted-argument = #7dcfff

[other]
variable             = #7dcfff
assign               = #89ddff
assign-array-bracket = #89ddff
history-expansion    = #ff9e64,bold

[math]
mathvar = #7dcfff
mathnum = #ff9e64
matherr = #f7768e

[for-loop]
forvar  = #7dcfff
fornum  = #ff9e64
; operator
foroper = #89ddff
; separator
forsep  = #89ddff

[case]
case-input       = #7dcfff
case-parentheses = #89ddff
case-condition   = #bb9af7
