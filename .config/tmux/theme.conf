# vim: ft=tmux

# Run bash script below to get the values of "colour" variables.
# #! /bin/bash
#
# for i in {0..255}; do
#     printf '\x1b[38;5;%dmcolour%d\x1b[0m\n' $i $i
# done

# ---- dependency check ------------------------------------------------
# The bar shells out to git and workmux. Both pills degrade to nothing
# when their tool is missing, which is right for the bar but hides a PATH
# problem behind an empty segment -- so warn once here instead.
# Backgrounded so a slow check never stalls sourcing.
run-shell -b '~/.config/tmux/status-deps.sh'

# ---- palette ---------------------------------------------------------
# ANSI 0-15 only, on purpose: those indices are remapped by the terminal
# theme, so the bar retints itself when the Ghostty theme changes.
# colour16-255 are fixed cube values and would NOT follow -- don't use
# them here. Ghostty's Tokyonight Night maps 9-14 to the same values as
# 1-6, so there is no bright tier to reach for on this theme.
#
# Everything below refers to these names; retheming means editing this
# block and nothing else.
set -g @sb_dark   colour0    # text drawn on top of a coloured cap
set -g @sb_body   colour0    # pill body background
set -g @sb_alert  colour1    # agent waiting; prefix pressed
set -g @sb_ok     colour2    # agent done; normal mode; active window
set -g @sb_busy   colour3    # agent working; copy mode
set -g @sb_clock  colour4
set -g @sb_git    colour5
set -g @sb_face   colour7    # text drawn on top of a muted cap
set -g @sb_mute   colour8    # muted cap; inactive window; stale agent
set -g @sb_text   colour15   # body text

set-window-option -g clock-mode-colour colour12

set -g status-style "fg=#{@sb_text},bg=default"

# Style options, not formats: these take literal ANSI indices rather than
# #{@sb_*}. Formats are verified to expand user options; style options
# accept the syntax but aren't confirmed to render it, and a silent
# failure here would mis-colour every status-line message. Plain ANSI
# still follows the terminal theme, which is the point.
set -g mode-style "fg=colour0,bg=colour3"              # @sb_dark on @sb_busy
set -g message-style "fg=colour0,bg=colour3"           # @sb_dark on @sb_busy
set -g message-command-style "fg=colour0,bg=colour3"   # @sb_dark on @sb_busy

# Inactive borders recede, active border is the bright one.
set -g pane-border-style "fg=colour8"
set -g pane-active-border-style "fg=colour10"

# Popups (lazygit, sesh, cheat.sh, workmux, notes) and menus (choose-tree,
# right-click). bg=default keeps the Ghostty wallpaper showing through.
set -g popup-border-lines rounded
set -g popup-border-style "fg=colour10"
set -g popup-style "bg=default"

set -g menu-border-lines rounded
set -g menu-border-style "fg=colour8"
set -g menu-style "fg=colour7,bg=colour0"
set -g menu-selected-style "fg=colour0,bg=colour10,bold"

set -g status "on"
set -g status 2
set -g 'status-format[1]' ''
# The clock is minute resolution and the prefix indicator redraws on
# keypress, so neither needs polling. The interval exists for the two
# data pills: it bounds how long a 'waiting' agent stays invisible and
# how stale the git counts are.
#
# Measured CPU per tick (user+sys -- the earlier note quoted wall time,
# which overstates load since all three run concurrently as tmux jobs and
# redraws never block on them):
#
#   agents.sh          86ms   workmux startup dominates, 57% of the total
#   git-status.sh      37ms   three git invocations, ~20ms of startup each
#   continuum_save.sh  28ms   injects its own #() into status-right, so it
#                             rides this interval (early-exits between
#                             its 15min saves)
#   total             151ms
#
# 5.0% of one core at 3s, against 7.6% at 2s and 3.0% at 5s. 3s is the
# balance: the extra second is below the rate you actually glance at the
# bar, while 5s is visibly laggy when you *are* watching -- saving in
# nvim and waiting for the unstaged count to move.
#
# tmux keys #() jobs by their command string, so agents.sh and
# continuum_save.sh run once for the whole server however many clients
# are attached; only git-status.sh multiplies, once per distinct
# active-pane path.
#
# If this ever needs to come down further, the lever is workmux's startup
# time, not this number.
set -g status-interval 3
set -g status-justify "centre"

set -g status-left-length "100"
set -g status-left-style NONE
set -g status-left "#[fg=#{@sb_dark},#{?client_prefix,bg=#{@sb_alert},#{?pane_in_mode,bg=#{@sb_busy},bg=#{@sb_ok}}}]  #[default,bg=#{@sb_body},fg=#{@sb_text}] #S "

set -g status-right-length "100"
set -g status-right-style NONE
set -g status-right "#(~/.config/tmux/agents.sh)#(~/.config/tmux/git-status.sh '#{pane_current_path}')#[fg=#{@sb_dark},bg=#{@sb_clock}]  #[default,bg=#{@sb_body},fg=#{@sb_text}] %a %d %b  %H:%M "

setw -g window-status-activity-style "underscore,bold"
setw -g window-status-separator " "
setw -g window-status-style "NONE,fg=#{@sb_text},bg=default"
setw -g window-status-format '#[bg=#{@sb_mute},fg=#{@sb_face}] #I #[bg=#{@sb_body},fg=#{@sb_mute}] #{b:pane_current_path} #{?window_zoomed_flag, ,}#{?window_marked_flag,󰄳 ,}'
setw -g window-status-current-format '#[fg=#{@sb_dark},bg=#{@sb_ok}] #I #[default,bg=#{@sb_body},fg=#{@sb_text}] #{b:pane_current_path} #{?window_zoomed_flag, ,}#{?window_marked_flag,󰄳 ,}'

set -g window-style "fg=colour245,bg=default"
set -g window-active-style "fg=colour252,bg=default"
