# vim: ft=tmux
# Additions to the tmux 3.8 default keys. Defaults not mentioned here are
# untouched; the floating-pane menus on < and >, the g move table and Tab /
# BTab trees all work as documented in tmux(1).

# Splits open in the current path. | and \ split side by side, - and _
# stack; the \ and _ variants span the full window.
bind -N "Split right"                   |   split-window -h  -c "#{pane_current_path}"
bind -N "Split right, full height"      '\' split-window -fh -c "#{pane_current_path}"
bind -N "Split below"                   -   split-window -v  -c "#{pane_current_path}"
bind -N "Split below, full width"       _   split-window -fv -c "#{pane_current_path}"
bind -N "New window in the current path" c  new-window -c "#{pane_current_path}"

# hjkl pane selection. This takes l from last-window, which moves to BSpace.
bind -N "Select the pane to the left"  h select-pane -L
bind -N "Select the pane below"        j select-pane -D
bind -N "Select the pane above"        k select-pane -U
bind -N "Select the pane to the right" l select-pane -R
bind -N "Select the previously current window" BSpace last-window

# Helper sessions (_scratch, _notes, _cheat) stay out of the tree.
bind -N "Choose a session" s choose-tree -Zs -f '#{!:#{m:_*,#{session_name}}}'

# The status-left pill is what keeps this from being invisible while on.
bind -N "Toggle broadcasting input to all panes" b set -w synchronize-panes

bind -N "Reload the tmux config" R {
  source-file ~/.config/tmux/tmux.conf
  display "config reloaded"
}

# Copy mode. y and mouse drag copy through copy-command when one is set;
# without it they still fill the tmux buffer.
if -b 'command -v pbcopy' { set -s copy-command pbcopy }
bind -T copy-mode-vi v      send -X begin-selection
bind -T copy-mode-vi C-v    send -X rectangle-toggle
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi y      send -X copy-pipe-and-cancel
