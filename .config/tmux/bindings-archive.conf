# vim: ft=tmux
# Bindings retired in the refactor that still work without plugins and are
# not replaced by conf.d/ or a tmux 3.8 default. Not sourced: copy a line
# into conf.d/ to bring one back. Git history has the full old config.

# tmux 3.8 opens the window and pane menus on < and >.
bind -r -N "Swap with the previous window" < swap-window -d -t -1
bind -r -N "Swap with the next window"     > swap-window -d -t +1

# No J: tmux-fingers jump mode has it. L shadows the default switch-client -l.
bind -r -N "Resize the pane left by 5"  H resize-pane -L 5
bind -r -N "Resize the pane up by 5"    K resize-pane -U 5
bind -r -N "Resize the pane right by 5" L resize-pane -R 5

bind -N "Select the pane to the left"  C-h select-pane -L
bind -N "Select the pane below"        C-j select-pane -D
bind -N "Select the pane above"        C-k select-pane -U
bind -N "Select the pane to the right" C-l select-pane -R

bind -N "Select the next window"     C-n next-window
bind -N "Select the previous window" C-p previous-window

# The default " and % splits, but in the current path.
bind -N "Split below" '"' split-window -v -c "#{pane_current_path}"
bind -N "Split right" %   split-window -h -c "#{pane_current_path}"
