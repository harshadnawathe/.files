# vim: ft=tmux
# Floating panes are for ad-hoc work you launch yourself. Tool windows use
# popups or hidden sessions instead (40-tools.conf).
#
# Default geometry: 80% x 60%, centred. Move with prefix g (corners 1-4,
# edges with the arrows, M- to resize as well) or the pane menu on >.

bind -N "New floating pane in the current path" * \
  new-pane -c "#{pane_current_path}" -x80% -y60% -X10% -Y20%

bind -N "Float the current pane, or tile it back" F \
  if -F '#{pane_floating_flag}' { join-pane } { break-pane -W -x80% -y60% -X10% -Y20% }
