# vim: ft=tmux
# External tools. Two kinds of window:
#
#   popup           one-off dashboards that close with the tool (lazygit, sesh)
#   hidden session  keeps its state between uses (scratch, notes, cheat).
#                   A "_name" session shown through a popup; see
#                   bin/hidden-session.
#
# Each binding is made only when its tool is installed. Whatever is missing
# is reported once, a second after the config loads.

set -g @deps 'git lazygit sesh tv tmux-fingers workmux'
run -b -d 1 'm=; for t in #{@deps}; do command -v $t >/dev/null || m="$m $t"; done; [ -z "$m" ] || tmux display -d 5000 "tmux: not installed:$m (their bindings are off)"'

#### Popups ####

if -b 'command -v lazygit' {
  bind -N "Open lazygit in a popup" G \
    display-popup -E -w80% -h80% -d '#{pane_current_path}' -T '[ lazygit ]' lazygit
}

if -b 'command -v sesh && command -v tv' {
  bind -n -N "Switch session with sesh (no prefix)" M-Space \
    display-popup -E -w70% -h70% -d '#{pane_current_path}' -T '[ sesh ]' 'tv sesh'
}

#### Hidden sessions ####

bind -N "Open a scratch shell in a popup" T \
  display-popup -E -w80% -h80% -d '#{pane_current_path}' -T '[ scratch ]' \
  '~/.config/tmux/bin/hidden-session _scratch'

if -b 'test -x ~/bin/obsidian_notes' {
  bind -N "Open notes in a popup" N \
    display-popup -E -w80% -h80% -T '[ notes ]' \
    '~/.config/tmux/bin/hidden-session _notes ~/bin/obsidian_notes'
}

if -b 'command -v tv' {
  bind -N "Search cheat.sh in a popup" i \
    display-popup -E -w80% -h80% -T '[ cheat.sh ]' \
    '~/.config/tmux/bin/hidden-session _cheat tv cheat.sh'
}

#### tmux-fingers ####
# Loaded straight from the Homebrew binary: no tpm, no version wizard.
#   prefix Space   hint everything; Alt+hint opens the match in $EDITOR
#   prefix e       hint file paths only and open the pick in $EDITOR

if -b 'command -v tmux-fingers' {
  set -g @fingers-key Space
  set -g @fingers-alt-action '~/.config/tmux/bin/fingers-edit'

  # Palette notes: backdrop muted blue-gray, hints Terminal Red for the
  # strongest contrast on the dark background, matches yellow, selections
  # in multi mode green.
  set -g @fingers-backdrop-style 'fg=colour60'
  set -g @fingers-hint-style 'fg=red,bold,bright'
  set -g @fingers-highlight-style 'fg=yellow,bold'
  set -g @fingers-selected-hint-style 'fg=green,bold'
  set -g @fingers-selected-highlight-style 'fg=green,bold'

  run 'tmux-fingers load-config'

  bind -N "Pick a file path and open it in \$EDITOR" e \
    run -b "#{@fingers-cli} start #{pane_id} --patterns path,git-status,diff --main-action ~/.config/tmux/bin/fingers-edit"
}
