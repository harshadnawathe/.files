# open zsh on start
set -g default-command "exec zsh -i"

#### Options ####
# Use Ctrl-a as prefix
set -g prefix C-a

# Enable mouse
setw -g mouse on
# Vi key bindings in Copy mode
setw -g mode-keys vi
# Put status bar on top
set-option -g status-position top 
# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on
# Switch to any exising session when final window for current session is closed.
set-option -g detach-on-destroy off
set -g status-left-length "100"
set -g status-right-length "100"

# Flag background activity in the window tab (styled in theme.conf).
# Without monitor-activity, window-status-activity-style never fires.
setw -g monitor-activity on
set -g visual-activity off

# Image rendering
set -g allow-passthrough all
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

set -g extended-keys on
set -as terminal-features ',xterm-ghostty:extkeys:hyperlinks:sync:usstyle'

#### key-bindings ####

# pain-control rebinds `l` to select-pane -R, which eats tmux's default
# last-window. Restore it on an otherwise-unbound key.
bind -r -N "Select the previously current window" BSpace last-window

# The status-left pill is what keeps this from being invisible while on.
bind -N "Toggle broadcasting input to all panes" b set -w synchronize-panes

bind -N "Open lazygit in a popup" G display-popup -d '#{pane_current_path}' -w80% -h80% -T '[ lazygit ]' -E lazygit

# Session management
# bind-key -n 'M-Space' run-shell '~/.config/tmux/ts.sh'
bind-key -n -N "Switch session with sesh (no prefix)" 'M-Space' "display-popup -E -w 70% -h 70% -d '#{pane_current_path}' -T '[ Sesh ]' tv sesh"
bind -N "Search cheat.sh in a popup" i display-popup -T '[ cheat.sh ]' -w80% -h80% -E 'tmux new-session -A -s _cheat "tmux set status off; tv cheat.sh; tmux detach -s _cheat"'

# Workmux
bind -N "Open the workmux dashboard" W display-popup -d '#{pane_current_path}' -w80% -h80% -E 'workmux dashboard'

bind -N "Toggle the workmux sidebar" a run-shell -b 'workmux sidebar'

bind -N "Jump to the agent done or waiting; repeat to cycle" A run-shell -b 'workmux last-done'
bind -N "Toggle between the two most recent agents" Tab run-shell -b 'workmux last-agent'
bind -N "Restore worktree sessions after a crash" M-r run-shell -b 'workmux resurrect'

bind -N "Open notes in a popup" N display-popup -T '[ notes ]' -w80% -h80% -E 'tmux attach _notes || tmux new-session -A -s _notes "tmux set status off; ~/bin/obsidian_notes; tmux detach -s _notes"'

# scratch shell, kept alive between invocations. status off so the popup
# does not carry a second copy of the bar; detach-on-destroy on so exiting
# closes the popup instead of switching it to another session, which the
# global off would otherwise do.
bind -N "Open a scratch shell in a popup" T display-popup -d '#{pane_current_path}' -w80% -h80% -T '[ scratch ]' -E 'tmux has-session -t _scratch 2>/dev/null || tmux new-session -d -s _scratch; tmux set -t _scratch status off; tmux set -t _scratch detach-on-destroy on; tmux attach -t _scratch'

# copy mode
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'C-v' send -X rectangle-toggle
bind-key -T copy-mode-vi Escape send -X cancel
# bind-key -T copy-mode-vi 'y' send -X copy-selection
# Applicable to macOS only
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

#### Status line ####
source ~/.config/tmux/theme.conf

#### Plugins ####

# Keep cloned plugin code out of the stowed config tree. Must precede tpm.
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.local/share/tmux/plugins"

# plugins
source ~/.config/tmux/plugins.conf

# Plugin manager
set -g @plugin 'tmux-plugins/tpm'

# Clone tpm and install the plugins on a fresh machine.
# Single quotes required: tmux expands "..." before set-environment above runs.
run 'tpm="$TMUX_PLUGIN_MANAGER_PATH/tpm"; \
     test -d "$tpm" || { git clone https://github.com/tmux-plugins/tpm "$tpm" && "$tpm/bin/install_plugins"; }'

# Initialize TMUX plugin manager (keep this line at the very bottom)
run '$TMUX_PLUGIN_MANAGER_PATH/tpm/tpm'

#### Plugin overrides ####

# pain-control's improve_new_window_binding() sets c to this exact command
# but without a note, and tpm runs it after the key-bindings section above.
# Binding c there is therefore dead code -- it has to come after tpm both to
# survive and to show up under prefix+?.
unbind c
bind -N "New window in the current path" c new-window -c "#{pane_current_path}"
