bind-key -T prefix J run-shell -b "/opt/homebrew/Cellar/tmux-fingers/2.7.1/bin/tmux-fingers start --mode jump #{pane_id} >>~/.local/state/tmux-fingers/fingers.log 2>&1"
bind-key -T prefix j select-pane -D
