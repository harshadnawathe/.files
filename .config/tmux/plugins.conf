# vim: ft=tmux
# After adding a plugin here 
# Reload config and run C-a S-i

set -g @plugin 'tmux-plugins/tmux-sensible'        # sensible default to remove some clutter in the file

set -g @plugin 'tmux-plugins/tmux-fpp'             # open file using fpp (install fpp)
setenv -g EDITOR nvim
set -g @fpp-bind off # Disable default fpp bindings
bind-key e run-shell '~/.config/tmux/plugins/tmux-fpp/fpp.tmux start edit' # Bind 'e' to run FPP launching an editor
bind-key 'C-e' run-shell '~/.config/tmux/plugins/tmux-fpp/fpp.tmux start paste' # Bind 'C-e' to run FPP and paste the list of files in the initial pane

set -g @plugin 'tmux-plugins/tmux-pain-control'    # Bindings for controlling panes

set -g @plugin 'tmux-plugins/tmux-sessionist'      # Utilities for manipulating tmux sessions

set -g @plugin 'sainnhe/tmux-fzf'                  # fzf ui to manage tmux session (install fzf)

# set -g @plugin 'fcsonline/tmux-thumbs'
#
# run-shell ~/.tmux/plugins/tmux-thumbs/tmux-thumbs.tmux

# Also covers URLs -- its built-in `url` pattern matches https?://, git@,
# git://, ssh://, ftp:// and file:///, which is why tmux-fzf-url was dropped.
set -g @plugin 'Morantron/tmux-fingers'
set -g @fingers-key Space

# 1. Dim the backdrop to push non-matches into the background
# Uses a muted blue-gray (#565f89 equivalent)
set -g @fingers-backdrop-style 'fg=colour60'

# 2. High-contrast Hints: Use 'Terminal Red' (#f7768e)
# Red is the most aggressive contrast against the dark night background
set -g @fingers-hint-style 'fg=red,bold,bright'

# 3. Prominent Highlights: Use 'Terminal Yellow' (#e0af68) or Cyan (#7dcfff)
# This makes the matched text "glow" differently from the backdrop
set -g @fingers-highlight-style 'fg=yellow,bold'

# 4. Multi-selection: Shift to 'Terminal Green' (#73daca) when selected
set -g @fingers-selected-hint-style 'fg=green,bold'
set -g @fingers-selected-highlight-style 'fg=green,bold'

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
