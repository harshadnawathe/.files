# vim: ft=tmux
# Only options that differ from tmux 3.8 defaults.

set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g history-limit 50000
set -g display-time 3000
set -s focus-events on

set -g mouse on
set -g mode-keys vi

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Switch to another session when the last window of this one closes.
set -g detach-on-destroy off

# Flag background activity in the window tab (styled in 90-theme.conf).
setw -g monitor-activity on
set -g visual-activity off

# Image rendering
set -g allow-passthrough all

# The appends below reset to the default first, so a reload does not
# append them again.
set -gu update-environment
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

set -s extended-keys on
set -su terminal-features
set -as terminal-features ',xterm-ghostty:extkeys:hyperlinks:sync:usstyle'
